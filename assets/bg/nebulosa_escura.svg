<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
<title>Nebulosa escura (tile sem emenda)</title>
<defs>
<filter id="azul" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency=".0016 .0024" numOctaves="5" seed="7" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 .08  0 0 0 0 .26  0 0 0 0 .72  2.9 0 0 0 -1.05"/>
</filter>
<filter id="violeta" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency=".0022 .0017" numOctaves="4" seed="23" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 .42  0 0 0 0 .12  0 0 0 0 .66  2.6 0 0 0 -1.05"/>
</filter>
<filter id="ciano" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency=".0034 .003" numOctaves="3" seed="41" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 .05  0 0 0 0 .62  0 0 0 0 .66  3.2 0 0 0 -1.45"/>
</filter>
</defs>
<rect width="1024" height="1024" fill="#030814"/>
<rect width="1024" height="1024" filter="url(#azul)" opacity=".8"/>
<rect width="1024" height="1024" filter="url(#violeta)" opacity=".6"/>
<rect width="1024" height="1024" filter="url(#ciano)" opacity=".4"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
